<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mobil Kotak</title>
<style>html,body{height:100%}
body{margin:0;background:#9fd0ee;color:#f2f4ef;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
 padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#speed{background:rgba(16,20,15,.72);padding:8px 12px;border-radius:10px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:96px}
#speed small{font-size:12px;font-weight:500;opacity:.8;margin-left:4px}
#hud .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#cam,#mute{pointer-events:auto;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:rgba(16,20,15,.72);color:#f2f4ef;touch-action:manipulation}
#cam:focus-visible,#mute:focus-visible{outline:2px solid #fff}
#help{position:fixed;left:0;right:0;top:60px;text-align:center;font-size:12px;color:#10140f;opacity:.75;padding:0 16px;pointer-events:none}
#dash{position:fixed;left:0;right:0;bottom:0;height:26vh;min-height:150px;background:linear-gradient(#0000,#101214 40%);display:none;pointer-events:none}
.inside #dash{display:block}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
 padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#wheel{pointer-events:auto;width:min(40vw,170px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.inside #wheel{width:min(48vw,230px);margin-bottom:-6%}
#wheel svg{width:100%;height:100%;display:block}
#pedals{pointer-events:auto;display:flex;gap:12px;align-items:flex-end}
#pedals button{border:0;border-radius:12px;color:#f2f4ef;font-weight:700;font-size:15px;touch-action:none;user-select:none}
#pedals [data-k=down]{width:64px;height:84px;background:#9b3a3a}
#pedals [data-k=up]{width:80px;height:110px;background:#3d8a4a}
#pedals button:active{filter:brightness(1.4)}
</style></head><body>
<canvas id="view"></canvas>
<div id="hud"><div id="speed"><span id="kmh">0</span><small>km/j</small></div><div class="btns"><button id="cam" type="button">Kamera: ATAS</button><button id="mute" type="button">Suara: KETUK</button></div></div>
<div id="help">Panah/WASD: gas, rem, belok · Spasi: rem · C: ganti kamera</div>
<div id="dash"></div>
<div id="pad">
<div id="wheel" aria-label="Setir"><svg viewBox="-100 -100 200 200">
<circle r="84" fill="none" stroke="#15171a" stroke-width="24"/>
<circle r="84" fill="none" stroke="#2c3036" stroke-width="20" stroke-dasharray="1.2 2.6"/>
<circle r="95.5" fill="none" stroke="#4d545c" stroke-width="1.6"/>
<circle r="72.5" fill="none" stroke="#050607" stroke-width="1.6"/>
<g stroke="#1b1e22" stroke-width="15" stroke-linecap="round"><line x1="-76" y1="6" x2="-16" y2="10"/><line x1="76" y1="6" x2="16" y2="10"/><line x1="0" y1="22" x2="0" y2="74"/></g>
<g stroke="#3b4148" stroke-width="2" stroke-linecap="round" fill="none"><line x1="-76" y1="0" x2="-16" y2="4"/><line x1="76" y1="0" x2="16" y2="4"/></g>
<circle r="29" fill="#22262b" stroke="#434a52" stroke-width="2"/>
<circle r="20" fill="#181b1f"/>
<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#d93a3a"/>
<rect x="-4" y="-97" width="8" height="17" rx="2" fill="#e0443a"/>
</svg></div>
<div id="pedals"><button data-k="down" aria-label="Rem">REM</button><button data-k="up" aria-label="Gas">GAS</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Mobil Kotak 3D =====
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0ee);
scene.fog = new THREE.Fog(0x9fd0ee, 90, 260);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.6); sun.position.set(40, 80, 30); scene.add(sun);

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));

// ---- lintasan: persegi bundar (pusat jalan), setengah lebar 7 ----
const A = 60, B = 35, R = 25, HALF = 7;
function sdf(x, z) { // jarak bertanda ke garis tengah jalan (negatif = di dalam oval)
  const qx = Math.abs(x) - (A - R), qz = Math.abs(z) - (B - R);
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - R;
}
const onRoad = (x, z) => Math.abs(sdf(x, z)) < HALF;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), mat(0x5a9e4b));
ground.rotation.x = -Math.PI / 2; scene.add(ground);

function ringShape() {
  const outer = new THREE.Shape();
  roundRect(outer, A + HALF, B + HALF, R + HALF);
  const hole = new THREE.Path();
  roundRect(hole, A - HALF, B - HALF, R - HALF);
  outer.holes.push(hole);
  return outer;
}
function roundRect(p, a, b, k) {
  p.moveTo(a, -(b - k)); p.lineTo(a, b - k);
  p.absarc(a - k, b - k, k, 0, Math.PI / 2, false);
  p.lineTo(-(a - k), b);
  p.absarc(-(a - k), b - k, k, Math.PI / 2, Math.PI, false);
  p.lineTo(-a, -(b - k));
  p.absarc(-(a - k), -(b - k), k, Math.PI, Math.PI * 1.5, false);
  p.lineTo(a - k, -b);
  p.absarc(a - k, -(b - k), k, Math.PI * 1.5, Math.PI * 2, false);
}
const asphalt = new THREE.Mesh(new THREE.ShapeGeometry(ringShape(), 24), mat(0x3d4044));
asphalt.rotation.x = -Math.PI / 2; asphalt.position.y = 0.02; scene.add(asphalt);

// marka putus-putus: ambil sampel titik di garis tengah lewat pencarian sudut sederhana
(function dashes() {
  const a = A - R, b = B - R;
  const pts = [];
  const step = 3.2;
  const add = (x, z, rot) => pts.push([x, z, rot]);
  for (let x = -a; x < a; x += step * 2) add(x + step / 2, -B, 0);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(a + Math.sin(t) * R, -b - Math.cos(t) * R, -(t));
  for (let z = -b; z < b; z += step * 2) add(A, z + step / 2, Math.PI / 2);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(a + Math.cos(t) * R, b + Math.sin(t) * R, Math.PI / 2 - t);
  for (let x = a; x > -a; x -= step * 2) add(x - step / 2, B, 0);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(-a - Math.sin(t) * R, b + Math.cos(t) * R, t);
  for (let z = b; z > -b; z -= step * 2) add(-A, z - step / 2, Math.PI / 2);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(-a - Math.cos(t) * R, -b - Math.sin(t) * R, Math.PI / 2 - t);
  const g = new THREE.BoxGeometry(step, 0.02, 0.35), m = mat(0xf0f0e6);
  for (const [x, z, r] of pts) { const d = new THREE.Mesh(g, m); d.position.set(x, 0.05, z); d.rotation.y = r; scene.add(d); }
})();
// garis start
const startLine = box(1.2, 0.03, HALF * 2, 0xffffff); startLine.position.set(0, 0.06, -B); scene.add(startLine);

// ---- pohon dan rumah (dengan collider bulat) ----
const colliders = [];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function tree(x, z) {
  const g = new THREE.Group();
  const h = 2 + rnd() * 1.5;
  const greens = [0x2f7d3a, 0x3b9447, 0x2a6e35, 0x4aa04f], gi = Math.floor(rnd() * 4);
  const t = box(0.9, h, 0.9, 0x6b4a2b); t.position.y = h / 2; g.add(t);
  const sc = 0.75 + rnd() * 0.7, s1 = (3 + rnd()) * sc, l1 = box(s1, 2.2 * sc, s1, greens[gi]); l1.position.y = h + 0.9; g.add(l1);
  const s2 = s1 * 0.65, l2 = box(s2, 1.8 * sc, s2, greens[(gi + 1) % 4]); l2.position.y = h + 2.3 * sc; g.add(l2);
  g.position.set(x, 0, z); g.rotation.y = rnd() * Math.PI; scene.add(g);
  colliders.push({ x, z, r: 1.6 });
}
function bush(x, z) {
  const k = 0.8 + rnd() * 0.9, b = box(k * 1.4, k, k * 1.4, rnd() < 0.5 ? 0x3f8f3f : 0x4fa34a);
  b.position.set(x, k / 2, z); b.rotation.y = rnd() * Math.PI; scene.add(b);
  colliders.push({ x, z, r: k * 0.7 });
}
const houseColors = [0xe8d9b5, 0xd96c5a, 0x7fb0d6, 0xf0c44a, 0xb9d6a0, 0xe0a0c0];
function house(x, z) {
  const g = new THREE.Group();
  const w = 8 + rnd() * 3, d = 7 + rnd() * 2, h = 4.5;
  const body = box(w, h, d, houseColors[Math.floor(rnd() * houseColors.length)]); body.position.y = h / 2; g.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(Math.max(w, d) * 0.78, 3.2, 4), mat(0x9a3b2e));
  roof.rotation.y = Math.PI / 4; roof.position.y = h + 1.6; g.add(roof);
  const door = box(1.4, 2.4, 0.15, 0x5b3a22); door.position.set(0, 1.2, d / 2 + 0.05); g.add(door);
  for (const sx of [-w / 3, w / 3]) { const win = box(1.4, 1.3, 0.15, 0x9fd8ff); win.position.set(sx, 2.8, d / 2 + 0.05); g.add(win); }
  g.position.set(x, 0, z); g.rotation.y = Math.round(rnd() * 4) * Math.PI / 2; scene.add(g);
  colliders.push({ x, z, r: Math.max(w, d) * 0.62 });
}
function spot(minSdf, maxSdf, minGap, xr, zr) {
  for (let i = 0; i < 60; i++) {
    const x = (rnd() * 2 - 1) * xr, z = (rnd() * 2 - 1) * zr, s = sdf(x, z);
    if (s < minSdf || s > maxSdf) continue;
    if (colliders.some(c => Math.hypot(c.x - x, c.z - z) < c.r + minGap)) continue;
    return [x, z];
  }
  return null;
}
for (let i = 0; i < 26; i++) { const p = spot(16, 90, 3, 170, 140); if (p) house(p[0], p[1]); }   // di luar lintasan
for (let i = 0; i < 4; i++) { const p = spot(-60, -16, 4, 50, 28); if (p) house(p[0], p[1]); }    // di tengah lintasan
for (let i = 0; i < 300; i++) { const p = spot(11, 140, 1.6, 190, 160); if (p) tree(p[0], p[1]); }
for (let i = 0; i < 120; i++) { const p = spot(10, 140, 0.8, 190, 160); if (p) bush(p[0], p[1]); }
for (let i = 0; i < 40; i++) { const p = spot(-60, -11, 1.6, 50, 28); if (p) tree(p[0], p[1]); }
for (let i = 0; i < 20; i++) { const p = spot(-60, -10, 0.8, 50, 28); if (p) bush(p[0], p[1]); }

// ---- mobil (bodi melengkung: kap, spakbor, bundar di moncong) ----
const carMesh = new THREE.Group();
const paint = new THREE.MeshLambertMaterial({ color: 0xd93a3a, side: THREE.DoubleSide });
function makeHood(len, width) {
  const g = new THREE.PlaneGeometry(1, 1, 24, 24), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const u = p.getX(i) * 2, v = p.getY(i) + 0.5;               // u: -1..1 lebar, v: 0..1 panjang
    const nose = Math.max(0, (v - 0.72) / 0.28);
    const hw = (width / 2) * (1 - 0.12 * v * v) * Math.sqrt(Math.max(0.02, 1 - Math.pow(nose, 2.4) * 0.6));
    const y = 0.86 - 0.34 * Math.pow(v, 2.2) - 0.2 * Math.pow(Math.abs(u), 3) * (1 - 0.3 * v) + 0.09 * (1 - u * u) * (1 - 0.6 * v);
    p.setXYZ(i, u * hw, y, v * len);
  }
  g.computeVertexNormals();
  return new THREE.Mesh(g, paint);
}
const hood = makeHood(1.9, 1.95); hood.position.z = 0.25; carMesh.add(hood);
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.5, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), paint); // moncong bawah
nose.scale.set(1.9, 0.9, 0.9); nose.rotation.x = Math.PI / 2; nose.position.set(0, 0.62, 2.0); // dilihat dari luar saja
carMesh.add(nose);
const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.55, 2.6), paint); body.position.set(0, 0.6, -0.95); carMesh.add(body);
for (const sx of [-1, 1]) {                                     // spakbor menonjol di kiri-kanan kap
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.6, 14, 10), paint);
  f.scale.set(0.38, 0.32, 1.15); f.position.set(sx * 0.93, 0.86, 1.2); carMesh.add(f);
}
const cabin = box(1.8, 0.65, 2, 0xb02e2e); cabin.position.set(0, 1.25, -0.8); carMesh.add(cabin);
const glass = box(1.82, 0.4, 1.6, 0x9fd8ff); glass.position.set(0, 1.3, -0.8); carMesh.add(glass);
const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.34, 14); wheelGeo.rotateZ(Math.PI / 2);
for (const [x, z] of [[-1.02, 1.3], [1.02, 1.3], [-1.02, -1.5], [1.02, -1.5]]) { const w = new THREE.Mesh(wheelGeo, mat(0x151515)); w.position.set(x, 0.42, z); carMesh.add(w); }
const headGeo = new THREE.SphereGeometry(0.17, 10, 8);
for (const x of [-0.62, 0.62]) { const l = new THREE.Mesh(headGeo, mat(0xffe97a)); l.scale.z = 0.6; l.position.set(x, 0.66, 2.0); carMesh.add(l); }
const grill = box(0.8, 0.14, 0.08, 0x1a1a1a); grill.position.set(0, 0.55, 2.1); carMesh.add(grill);
scene.add(carMesh);
scene.add(camera);
// bagian kabin yang tampak dari dalam: tiang kaca depan, atap, kaca spion
const cockpit = new THREE.Group(); cockpit.visible = false; camera.add(cockpit);
const dark = mat(0x16181b);
for (const sx of [-1, 1]) { const pil = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.1), dark); pil.position.set(sx * 0.95, 0.1, -1.0); pil.rotation.z = -sx * 0.35; cockpit.add(pil); }
const header = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.05, 0.3), dark); header.position.set(0, 0.8, -0.9); cockpit.add(header);
const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.14, 0.05), dark); mirror.position.set(0, 0.62, -0.95); cockpit.add(mirror);

const car = { x: 0, z: -B, h: Math.PI / 2, v: 0 };

// ---- input ----
const keys = {};
const map = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'brake' };
addEventListener('keydown', e => {
  if (e.code === 'KeyC') { if (!e.repeat) toggleCam(); e.preventDefault(); return; }
  const k = map[e.code]; if (k) { keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { const k = map[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('pointerdown', () => window.focus());
window.focus();
document.querySelectorAll('#pedals button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { keys[k] = true; b.setPointerCapture(e.pointerId); e.preventDefault(); });
  const off = e => { keys[k] = false; e.preventDefault(); };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// setir
const wheel = document.getElementById('wheel');
let wheelAngle = 0, wheelDrag = null;
const MAXW = 120;
const ang = e => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
wheel.addEventListener('pointerdown', e => { wheel.setPointerCapture(e.pointerId); wheelDrag = { last: ang(e) }; e.preventDefault(); });
wheel.addEventListener('pointermove', e => {
  if (!wheelDrag) return;
  const a = ang(e); let d = a - wheelDrag.last; if (d > 180) d -= 360; if (d < -180) d += 360;
  wheelDrag.last = a; wheelAngle = Math.max(-MAXW, Math.min(MAXW, wheelAngle + d));
});
const wheelUp = () => { wheelDrag = null; };
wheel.addEventListener('pointerup', wheelUp); wheel.addEventListener('pointercancel', wheelUp);
wheel.addEventListener('contextmenu', e => e.preventDefault());

// kamera
let inside = false;
const camBtn = document.getElementById('cam');
function toggleCam() {
  inside = !inside;
  document.body.classList.toggle('inside', inside);
  camBtn.textContent = 'Kamera: ' + (inside ? 'DALAM' : 'ATAS');
  camera.fov = inside ? 72 : 55; camera.updateProjectionMatrix();
  carMesh.children.forEach(c => { if (c === cabin || c === glass || c === nose) c.visible = !inside; });
  cockpit.visible = inside;
  snapCam = true;
}
camBtn.addEventListener('click', toggleCam);
let snapCam = true;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();


// ---- suara (WebAudio, mulai setelah sentuhan/tombol pertama) ----
let AC = null, eng1, eng2, engGain, engFilter, noiseGain, thumpBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); AC.master = master;
    engFilter = AC.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 600;
    engGain = AC.createGain(); engGain.gain.value = 0;
    eng1 = AC.createOscillator(); eng1.type = 'sawtooth';
    eng2 = AC.createOscillator(); eng2.type = 'square';
    eng1.connect(engFilter); eng2.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
    eng1.start(); eng2.start();
    // derau untuk decit rem dan tabrakan
    const len = AC.sampleRate, nb = AC.createBuffer(1, len, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    thumpBuf = nb;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 6;
    noiseGain = AC.createGain(); noiseGain.gain.value = 0;
    ns.connect(bp); bp.connect(noiseGain); noiseGain.connect(master); ns.start();
  } catch (e) { AC = null; }
}
function unlockAudio() {
  initAudio();
  if (AC && AC.state !== 'running') AC.resume().then(() => { if (AC.state === 'running') ping(); }).catch(() => {});
}
function ping() { // bunyi pendek tanda suara aktif
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 660;
  g.gain.setValueAtTime(0.15, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.15);
  o.connect(g); g.connect(AC.master); o.start(); o.stop(AC.currentTime + 0.16);
}
// browser baru mengizinkan suara setelah sentuhan selesai / klik / tombol: pasang semuanya
['pointerdown', 'pointerup', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, true));
function thump() {
  if (!AC || muted) return;
  const src = AC.createBufferSource(); src.buffer = thumpBuf;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400;
  const g = AC.createGain(); g.gain.setValueAtTime(0.7, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.25);
  src.connect(lp); lp.connect(g); g.connect(AC.master); src.start(); src.stop(AC.currentTime + 0.3);
}
function audioUpdate(throttle, braking, speed) {
  if (!AC) return;
  const t = AC.currentTime, sp = Math.abs(speed);
  const f = 38 + sp * 6.5 + (throttle ? 14 : 0);
  eng1.frequency.setTargetAtTime(f, t, 0.08); eng2.frequency.setTargetAtTime(f * 0.5, t, 0.08);
  engFilter.frequency.setTargetAtTime(350 + sp * 55 + (throttle ? 500 : 0), t, 0.1);
  engGain.gain.setTargetAtTime(muted ? 0 : 0.07 + (throttle ? 0.07 : 0) + Math.min(0.05, sp * 0.003), t, 0.08);
  noiseGain.gain.setTargetAtTime(muted ? 0 : (braking && sp > 4 ? Math.min(0.16, 0.03 + sp * 0.007) : 0), t, 0.04);
}
const muteBtn = document.getElementById('mute');
function muteLabel() { muteBtn.textContent = 'Suara: ' + (muted ? 'MATI' : (AC && AC.state === 'running' ? 'HIDUP' : 'KETUK')); }
muteBtn.addEventListener('click', () => { if (AC && AC.state === 'running') muted = !muted; muteLabel(); if (!muted) ping(); });
setInterval(muteLabel, 500);

// ---- loop ----
const kmh = document.getElementById('kmh');
let last = performance.now();
let hitCool = 0;
function step(dt) {
  if (hitCool > 0) hitCool--;
  const road = onRoad(car.x, car.z);
  const maxV = road ? 20 : 7, maxR = -6;
  if (keys.up) car.v += 11 * dt;
  if (keys.down) car.v -= (car.v > 0.5 ? 26 : 9) * dt;
  if (keys.brake) car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), 30 * dt);
  car.v -= car.v * (road ? 0.25 : 1.6) * dt;
  if (!keys.up && !keys.down && Math.abs(car.v) < 0.15) car.v = 0;
  car.v = Math.max(maxR, Math.min(maxV, car.v));

  if (!wheelDrag) wheelAngle *= Math.pow(0.0008, dt); // setir balik ke tengah
  const keySteer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const steer = keySteer || wheelAngle / MAXW; // -1 kiri .. 1 kanan
  wheel.style.transform = 'rotate(' + (keySteer ? keySteer * 70 : wheelAngle) + 'deg)';
  const grip = Math.min(1, 0.3 + Math.abs(car.v) / 5);
  car.h -= steer * 1.7 * grip * Math.sign(car.v || 1) * dt;

  car.x += Math.sin(car.h) * car.v * dt;
  car.z += Math.cos(car.h) * car.v * dt;
  car.x = Math.max(-280, Math.min(280, car.x)); car.z = Math.max(-280, Math.min(280, car.z));
  for (const c of colliders) {
    const dx = car.x - c.x, dz = car.z - c.z, d = Math.hypot(dx, dz), m = c.r + 1.5;
    if (d < m && d > 0) { car.x = c.x + dx / d * m; car.z = c.z + dz / d * m; car.v *= 0.5; if (!hitCool) { thump(); hitCool = 12; } }
  }
}
function render() {
  carMesh.position.set(car.x, 0, car.z); carMesh.rotation.y = car.h;
  const fx = Math.sin(car.h), fz = Math.cos(car.h);
  let tx, ty, tz, lx, ly, lz;
  if (inside) {
    tx = car.x - fx * 0.5; ty = 1.55; tz = car.z - fz * 0.5;
    lx = car.x + fx * 14; ly = 0.9; lz = car.z + fz * 14;
  } else {
    tx = car.x; ty = 70; tz = car.z - 30; lx = car.x; ly = 0; lz = car.z;
  }
  if (snapCam) { camera.position.set(tx, ty, tz); snapCam = false; }
  const k = inside ? 1 : 0.12;
  camera.position.x += (tx - camera.position.x) * k;
  camera.position.y += (ty - camera.position.y) * k;
  camera.position.z += (tz - camera.position.z) * k;
  camera.up.set(0, 1, 0);
  camera.lookAt(lx, ly, lz);
  audioUpdate(keys.up, (keys.down && car.v > 0.5) || (keys.brake && Math.abs(car.v) > 1), car.v);
  kmh.textContent = Math.round(Math.abs(car.v) * 3.6);
  renderer.render(scene, camera);
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>

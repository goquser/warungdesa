<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mobil Kotak</title>
<style>html,body{height:100%}
body{margin:0;background:#9fd0ee;color:#f2f4ef;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
 padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#speed{background:rgba(16,20,15,.72);padding:8px 12px;border-radius:10px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:96px}
#speed small{font-size:12px;font-weight:500;opacity:.8;margin-left:4px}
#hud .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#cam,#mute{pointer-events:auto;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:rgba(16,20,15,.72);color:#f2f4ef;touch-action:manipulation}
#cam:focus-visible,#mute:focus-visible{outline:2px solid #fff}
#help{position:fixed;left:0;right:0;top:60px;text-align:center;font-size:12px;color:#10140f;opacity:.75;padding:0 16px;pointer-events:none}
#dash{position:fixed;left:0;right:0;bottom:0;height:26vh;min-height:150px;background:linear-gradient(#0000,#101214 40%);display:none;pointer-events:none}
.inside #dash{display:block}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
 padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#wheel{pointer-events:auto;width:min(40vw,170px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.inside #wheel{width:min(48vw,230px);margin-bottom:-6%}
#wheel svg{width:100%;height:100%;display:block}
#pedals{pointer-events:auto;display:flex;gap:12px;align-items:flex-end}
#pedals button{border:0;border-radius:12px;color:#f2f4ef;font-weight:700;font-size:15px;touch-action:none;user-select:none}
#pedals [data-k=down]{width:64px;height:84px;background:#9b3a3a}
#pedals [data-k=up]{width:80px;height:110px;background:#3d8a4a}
#pedals button:active{filter:brightness(1.4)}
@media (max-width:700px){#help{display:none}}
</style></head><body>
<canvas id="view"></canvas>
<div id="hud"><div id="speed"><span id="kmh">0</span><small>km/j</small></div><div class="btns"><button id="cam" type="button">Kamera: ATAS</button><button id="mute" type="button">Suara: KETUK</button></div></div>
<div id="help">Panah/WASD: gas, rem, belok · Spasi: rem · C: ganti kamera</div>
<div id="dash"></div>
<div id="pad">
<div id="wheel" aria-label="Setir"><svg viewBox="-100 -100 200 200">
<circle r="84" fill="none" stroke="#15171a" stroke-width="24"/>
<circle r="84" fill="none" stroke="#2c3036" stroke-width="20" stroke-dasharray="1.2 2.6"/>
<circle r="95.5" fill="none" stroke="#4d545c" stroke-width="1.6"/>
<circle r="72.5" fill="none" stroke="#050607" stroke-width="1.6"/>
<g stroke="#1b1e22" stroke-width="15" stroke-linecap="round"><line x1="-76" y1="6" x2="-16" y2="10"/><line x1="76" y1="6" x2="16" y2="10"/><line x1="0" y1="22" x2="0" y2="74"/></g>
<g stroke="#3b4148" stroke-width="2" stroke-linecap="round" fill="none"><line x1="-76" y1="0" x2="-16" y2="4"/><line x1="76" y1="0" x2="16" y2="4"/></g>
<circle r="29" fill="#22262b" stroke="#434a52" stroke-width="2"/>
<circle r="20" fill="#181b1f"/>
<rect x="-8" y="-8" width="16" height="16" rx="3" fill="#d93a3a"/>
<rect x="-4" y="-97" width="8" height="17" rx="2" fill="#e0443a"/>
</svg></div>
<div id="pedals"><button data-k="down" aria-label="Rem">REM</button><button data-k="up" aria-label="Gas">GAS</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== Mobil Kotak 3D =====
const C = h => new THREE.Color(h).convertSRGBToLinear();
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOG = 0xbcd6e8;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(C(FOG), 110, 330);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 700);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x587a42, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.25);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -55, right: 55, top: 55, bottom: -55, near: 10, far: 220 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

const mat = c => new THREE.MeshLambertMaterial({ color: C(c) });
const box = (w, h, d, c) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c));
const shade = (o, cast = true, recv = false) => { o.traverse(m => { if (m.isMesh) { m.castShadow = cast; m.receiveShadow = recv; } }); return o; };

// langit gradasi + lingkungan pantulan untuk cat mobil
function gradTex(stops, w = 4, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h); stops.forEach(([t, col]) => gr.addColorStop(t, col));
  g.fillStyle = gr; g.fillRect(0, 0, w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
const skyMat = new THREE.MeshBasicMaterial({ map: gradTex([[0, '#4f8fd0'], [0.45, '#9cc6ec'], [0.5, '#cfe2ef'], [1, '#8a9a7c']]), side: THREE.BackSide, fog: false, depthWrite: false });
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 24, 16), skyMat); scene.add(sky);
{
  const pm = new THREE.PMREMGenerator(renderer);
  const es = new THREE.Scene(); es.add(new THREE.Mesh(new THREE.SphereGeometry(50, 24, 16), new THREE.MeshBasicMaterial({ map: skyMat.map, side: THREE.BackSide })));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), new THREE.MeshBasicMaterial({ color: C(0xfff4d8) })); sunBall.position.set(25, 35, 15); es.add(sunBall);
  scene.environment = pm.fromScene(es, 0.02).texture; pm.dispose();
}

// ---- tekstur prosedural ----
function canvasTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (rep) t.repeat.set(rep[0], rep[1]); t.anisotropy = 4; return t;
}
let tseed = 3; const trnd = () => (tseed = (tseed * 16807) % 2147483647) / 2147483647;
function noise(g, w, h, n, a, light) { for (let i = 0; i < n; i++) { const v = light ? 255 : 0; g.fillStyle = `rgba(${v},${v},${v},${trnd() * a})`; g.fillRect(trnd() * w, trnd() * h, 1 + trnd() * 3, 1 + trnd() * 3); } }
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5c9a48'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `hsl(${88 + trnd() * 26},${38 + trnd() * 22}%,${28 + trnd() * 22}%)`; g.fillRect(trnd() * w, trnd() * h, 1 + trnd() * 2, 2 + trnd() * 4); }
}, [90, 90]);
const asphaltTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3e42'; g.fillRect(0, 0, w, h); noise(g, w, h, 4000, 0.35, true); noise(g, w, h, 3000, 0.3, false);
}, [10, 4]);
const plasterTex = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); noise(g, w, h, 900, 0.16, false); }, [3, 2]);
const brickTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#d8cfc4'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) {
    const x = c * 32 + (r % 2 ? 16 : 0) - 16, y = r * 16; const l = 38 + trnd() * 12;
    g.fillStyle = `hsl(${10 + trnd() * 10},${48 + trnd() * 10}%,${l}%)`; g.fillRect(x + 1.5, y + 1.5, 29, 13);
  }
}, [3, 2]);
const roofTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const x = c * 16 + (r % 2 ? 8 : 0) - 8, y = r * 16; g.fillStyle = `rgba(0,0,0,${0.08 + trnd() * 0.14})`; g.fillRect(x, y, 16, 16);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x, y + 14, 16, 2); g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(x, y, 16, 2);
  }
}, [3, 1.5]);
const windowTex = canvasTex(128, 160, (g, w, h) => {
  g.fillStyle = '#f2efe8'; g.fillRect(0, 0, w, h);
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#8fb6d8'); gr.addColorStop(0.5, '#4d6f93'); gr.addColorStop(1, '#2f4660');
  g.fillStyle = gr; g.fillRect(10, 10, w - 20, h - 20);
  g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.moveTo(14, 14); g.lineTo(70, 14); g.lineTo(14, 90); g.fill();
  g.fillStyle = '#f2efe8'; g.fillRect(w / 2 - 3, 10, 6, h - 20); g.fillRect(10, h / 2 - 3, w - 20, 6);
  g.strokeStyle = '#b9b3a6'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
});
const doorTex = canvasTex(96, 160, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); noise(g, w, h, 500, 0.18, false);
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3; g.strokeRect(14, 14, w - 28, 54); g.strokeRect(14, 80, w - 28, 66);
  g.fillStyle = '#d8b24a'; g.beginPath(); g.arc(w - 18, h / 2, 4, 0, 7); g.fill();
});

// ---- lintasan: persegi bundar (pusat jalan), setengah lebar 7 ----
const A = 60, B = 35, R = 25, HALF = 7;
function sdf(x, z) { // jarak bertanda ke garis tengah jalan (negatif = di dalam oval)
  const qx = Math.abs(x) - (A - R), qz = Math.abs(z) - (B - R);
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - R;
}
const onRoad = (x, z) => Math.abs(sdf(x, z)) < HALF;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshLambertMaterial({ map: grassTex }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function roundRect(p, a, b, k) {
  p.moveTo(a, -(b - k)); p.lineTo(a, b - k);
  p.absarc(a - k, b - k, k, 0, Math.PI / 2, false);
  p.lineTo(-(a - k), b);
  p.absarc(-(a - k), b - k, k, Math.PI / 2, Math.PI, false);
  p.lineTo(-a, -(b - k));
  p.absarc(-(a - k), -(b - k), k, Math.PI, Math.PI * 1.5, false);
  p.lineTo(a - k, -b);
  p.absarc(a - k, -(b - k), k, Math.PI * 1.5, Math.PI * 2, false);
}
function ring(inner, outer) { // inner/outer = jarak dari garis tengah (negatif = ke dalam)
  const o = new THREE.Shape(); roundRect(o, A + outer, B + outer, R + outer);
  const h = new THREE.Path(); roundRect(h, A + inner, B + inner, R + inner); o.holes.push(h);
  const g = new THREE.ShapeGeometry(o, 32);
  const uv = g.attributes.uv, pos = g.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, pos.getX(i) / 12, pos.getY(i) / 12);
  return g;
}
function flat(g, m, y) { const mesh = new THREE.Mesh(g, m); mesh.rotation.x = -Math.PI / 2; mesh.position.y = y; mesh.receiveShadow = true; scene.add(mesh); return mesh; }
flat(ring(-HALF - 1.2, HALF + 1.2), new THREE.MeshLambertMaterial({ color: C(0x9a9a92) }), 0.015);                  // bahu jalan / trotoar
flat(ring(-HALF, HALF), new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.92, metalness: 0 }), 0.03); // aspal
const edgeM = new THREE.MeshBasicMaterial({ color: C(0xf1f1e8) });
flat(ring(HALF - 0.75, HALF - 0.5), edgeM, 0.04); flat(ring(-HALF + 0.5, -HALF + 0.75), edgeM, 0.04);            // garis tepi
// marka tengah putus-putus
(function dashes() {
  const a = A - R, b = B - R, pts = [], step = 3.2;
  const add = (x, z, rot) => pts.push([x, z, rot]);
  for (let x = -a; x < a; x += step * 2) add(x + step / 2, -B, 0);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(a + Math.sin(t) * R, -b - Math.cos(t) * R, -t);
  for (let z = -b; z < b; z += step * 2) add(A, z + step / 2, Math.PI / 2);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(a + Math.cos(t) * R, b + Math.sin(t) * R, Math.PI / 2 - t);
  for (let x = a; x > -a; x -= step * 2) add(x - step / 2, B, 0);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(-a - Math.sin(t) * R, b + Math.cos(t) * R, t);
  for (let z = b; z > -b; z -= step * 2) add(-A, z - step / 2, Math.PI / 2);
  for (let t = 0; t < Math.PI / 2; t += step * 2 / R) add(-a - Math.cos(t) * R, -b - Math.sin(t) * R, Math.PI / 2 - t);
  const g = new THREE.BoxGeometry(step, 0.02, 0.28), m = new THREE.MeshBasicMaterial({ color: C(0xf4d34a) });
  for (const [x, z, r] of pts) { const d = new THREE.Mesh(g, m); d.position.set(x, 0.05, z); d.rotation.y = r; scene.add(d); }
})();
const startLine = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.02, HALF * 2 - 1.6), new THREE.MeshBasicMaterial({ color: C(0xffffff) })); startLine.position.set(0, 0.05, -B); scene.add(startLine);

// ---- utilitas: gabung beberapa bentuk jadi satu geometri berwarna ----
function merged(parts) { // parts: [geometry, matrix, colorHex]
  const P = [], N = [], CC = [];
  for (const [geo, m, col] of parts) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone(); g.applyMatrix4(m); g.computeVertexNormals();
    const c = C(col), p = g.attributes.position, n = g.attributes.normal;
    for (let i = 0; i < p.count; i++) { P.push(p.getX(i), p.getY(i), p.getZ(i)); N.push(n.getX(i), n.getY(i), n.getZ(i)); CC.push(c.r, c.g, c.b); }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(CC, 3));
  return out;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function blob(r, detail, jit, sy) { // bola tidak beraturan untuk tajuk pohon
  const g = new THREE.IcosahedronGeometry(r, detail), p = g.attributes.position;
  const cache = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(3) + p.getY(i).toFixed(3) + p.getZ(i).toFixed(3);
    if (!cache.has(k)) cache.set(k, 1 + (rnd() - 0.5) * jit);
    const f = cache.get(k); p.setXYZ(i, p.getX(i) * f, p.getY(i) * f * sy, p.getZ(i) * f);
  }
  return g;
}
const M4 = (x, y, z, sx = 1, sy = 1, sz = 1) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion(), new THREE.Vector3(sx, sy, sz));
const leafCols = [[0x2f6f33, 0x3f8a3f, 0x4e9a45], [0x35763a, 0x2a5e30, 0x4a8f3c], [0x5b8f35, 0x6fa23c, 0x4a7f30], [0x3c7a45, 0x2d6a3b, 0x58934a]];
const treeGeos = [];
for (let v = 0; v < 6; v++) { // 4 pohon berdaun lebar + 2 cemara
  const parts = [];
  if (v < 4) {
    const h = 3.2 + rnd() * 1.6, tr = new THREE.CylinderGeometry(0.22, 0.42, h, 8);
    parts.push([tr, M4(0, h / 2, 0), 0x5a4030]);
    for (const [bx, bz, bh] of [[0.3, 0.1, 0.55], [-0.35, -0.1, 0.7]]) { const br = new THREE.CylinderGeometry(0.07, 0.14, 1.6, 5); const m = M4(bx * 2, h * bh + 0.5, bz * 2); m.multiply(new THREE.Matrix4().makeRotationZ(bx > 0 ? -0.8 : 0.8)); parts.push([br, m, 0x5a4030]); }
    const cols = leafCols[v];
    const R0 = 2.3 + rnd() * 0.6;
    parts.push([blob(R0, 2, 0.35, 0.85), M4(0, h + 1.5, 0), cols[0]]);
    for (let k = 0; k < 5; k++) { const a = rnd() * 6.28, rr = R0 * (0.5 + rnd() * 0.4); parts.push([blob(R0 * (0.55 + rnd() * 0.3), 1, 0.4, 0.85), M4(Math.cos(a) * rr, h + 0.7 + rnd() * 2.4, Math.sin(a) * rr), cols[1 + (k % 2)]]); }
  } else {
    const h = 2.2; parts.push([new THREE.CylinderGeometry(0.18, 0.34, h, 7), M4(0, h / 2, 0), 0x4e3a2b]);
    const n = 5 + (v - 4);
    for (let k = 0; k < n; k++) { const r = 2.5 - k * (2.0 / n), y = 1.6 + k * (5.5 / n); const c = new THREE.ConeGeometry(r, 2.4, 9, 1); parts.push([c, M4((rnd() - .5) * 0.25, y + 1.2, (rnd() - .5) * 0.25, 1, 1, 1), k % 2 ? 0x1f5a34 : 0x2a6a3c]); }
  }
  treeGeos.push(merged(parts));
}
const bushGeos = [0, 1, 2].map(() => merged([[blob(0.9, 1, 0.5, 0.75), M4(0, 0.6, 0), 0x3c7a3a], [blob(0.65, 1, 0.5, 0.75), M4(0.8, 0.45, 0.3), 0x4a8c40], [blob(0.6, 1, 0.5, 0.75), M4(-0.7, 0.4, -0.3), 0x356f38]]));
const foliageMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true });

const colliders = [];
function tree(x, z) {
  const v = Math.floor(rnd() * 6), s = 0.8 + rnd() * 0.7;
  const m = new THREE.Mesh(treeGeos[v], foliageMat); m.position.set(x, 0, z); m.scale.set(s, s * (0.9 + rnd() * 0.3), s); m.rotation.y = rnd() * 6.28;
  m.castShadow = true; scene.add(m); colliders.push({ x, z, r: 0.8 * s + 0.3 });
}
function bush(x, z) {
  const m = new THREE.Mesh(bushGeos[Math.floor(rnd() * 3)], foliageMat); const s = 0.8 + rnd() * 0.8;
  m.position.set(x, 0, z); m.scale.setScalar(s); m.rotation.y = rnd() * 6.28; m.castShadow = true; scene.add(m);
  colliders.push({ x, z, r: s * 1.0 });
}

// ---- rumah: dinding bertekstur, atap pelana, cerobong, jendela, pintu, teras ----
const wallColors = [0xf0e6d2, 0xe9d3b0, 0xcfe0e8, 0xe8c9c0, 0xd9e2c4, 0xf4f0e6];
const roofColors = [0x8a3a2c, 0x5a4a44, 0x6b3a30, 0x44525c];
const winMat = new THREE.MeshStandardMaterial({ map: windowTex, roughness: 0.3, metalness: 0.2 });
const doorMat = new THREE.MeshStandardMaterial({ map: doorTex, color: C(0x6a4630), roughness: 0.7 });
function house(x, z) {
  const g = new THREE.Group();
  const w = 9 + rnd() * 3, d = 7.5 + rnd() * 2, h = 3.6 + rnd() * 0.5;
  const brick = rnd() < 0.35;
  const wm = new THREE.MeshStandardMaterial({ map: brick ? brickTex : plasterTex, color: brick ? C(0xffffff) : C(wallColors[Math.floor(rnd() * wallColors.length)]), roughness: 0.9 });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wm); wall.position.y = h / 2 + 0.3; g.add(wall);
  const base = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.3, d + 0.2), mat(0x8d8a84)); base.position.y = 0.15; g.add(base);
  // atap pelana: prisma segitiga, bubungan sejajar sumbu lebar
  const rh = 2.4 + rnd() * 0.8, ov = 0.7;
  const sh = new THREE.Shape(); sh.moveTo(-d / 2 - ov, 0); sh.lineTo(d / 2 + ov, 0); sh.lineTo(0, rh); sh.closePath();
  const rg = new THREE.ExtrudeGeometry(sh, { depth: w + ov * 2, bevelEnabled: false });
  const uv = rg.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 0.12, uv.getY(i) * 0.12);

function spot(minSdf, maxSdf, minGap, xr, zr) {
  for (let i = 0; i < 60; i++) {
    const x = (rnd() * 2 - 1) * xr, z = (rnd() * 2 - 1) * zr, s = sdf(x, z);
    if (s < minSdf || s > maxSdf) continue;

// ---- suara (WebAudio, mulai setelah sentuhan/tombol pertama) ----
let AC = null, eng1, eng2, engGain, engFilter, noiseGain, thumpBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const master = AC.createGain(); master.gain.value = 1.0; master.connect(AC.destination); AC.master = master;
    engFilter = AC.createBiquadFilter(); engFilter.type = 'lowpass'; engFilter.frequency.value = 600;
    engGain = AC.createGain(); engGain.gain.value = 0;
    eng1 = AC.createOscillator(); eng1.type = 'sawtooth';
    eng2 = AC.createOscillator(); eng2.type = 'square';
    eng1.connect(engFilter); eng2.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
    eng1.start(); eng2.start();
    // derau untuk decit rem dan tabrakan
    const len = AC.sampleRate, nb = AC.createBuffer(1, len, AC.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    thumpBuf = nb;
    const ns = AC.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 6;
    noiseGain = AC.createGain(); noiseGain.gain.value = 0;
    ns.connect(bp); bp.connect(noiseGain); noiseGain.connect(master); ns.start();
  } catch (e) { AC = null; }
}
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let silentEl = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { if (!silentEl) { silentEl = new Audio(SILENT); silentEl.loop = true; silentEl.play().catch(() => {}); } } catch (e) {}
  initAudio();
  if (AC && AC.state !== 'running') AC.resume().then(() => { if (AC.state === 'running') ping(); }).catch(() => {});
}
function ping() { // bunyi pendek tanda suara aktif
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 880;
  g.gain.setValueAtTime(0.5, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.3);
  o.connect(g); g.connect(AC.master); o.start(); o.stop(AC.currentTime + 0.32);
}
// browser baru mengizinkan suara setelah sentuhan selesai / klik / tombol: pasang semuanya
['pointerdown', 'pointerup', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio, true));
function thump() {
  if (!AC || muted) return;
  const src = AC.createBufferSource(); src.buffer = thumpBuf;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
  const g = AC.createGain(); g.gain.setValueAtTime(1.2, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.25);
  src.connect(lp); lp.connect(g); g.connect(AC.master); src.start(); src.stop(AC.currentTime + 0.3);
}
function audioUpdate(throttle, braking, speed) {
  if (!AC) return;
  const t = AC.currentTime, sp = Math.abs(speed);
  const f = 85 + sp * 9 + (throttle ? 25 : 0);
  eng1.frequency.setTargetAtTime(f, t, 0.08); eng2.frequency.setTargetAtTime(f * 1.5, t, 0.08);
  engFilter.frequency.setTargetAtTime(900 + sp * 90 + (throttle ? 900 : 0), t, 0.1);
  engGain.gain.setTargetAtTime(muted ? 0 : 0.14 + (throttle ? 0.14 : 0) + Math.min(0.1, sp * 0.006), t, 0.08);
  noiseGain.gain.setTargetAtTime(muted ? 0 : (braking && sp > 4 ? Math.min(0.5, 0.12 + sp * 0.02) : 0), t, 0.04);
}
const muteBtn = document.getElementById('mute');

muteBtn.addEventListener('click', () => { if (AC && AC.state === 'running') muted = !muted; muteLabel(); if (!muted) ping(); });
setInterval(muteLabel, 500);

// ---- loop ----
const kmh = document.getElementById('kmh');
let last = performance.now();
let hitCool = 0;
function step(dt) {
  if (hitCool > 0) hitCool--;
  const road = onRoad(car.x, car.z);
  const maxV = road ? 20 : 7, maxR = -6;
  if (keys.up) car.v += 11 * dt;
  if (keys.down) car.v -= (car.v > 0.5 ? 26 : 9) * dt;
  if (keys.brake) car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), 30 * dt);
  car.v -= car.v * (road ? 0.25 : 1.6) * dt;
  if (!keys.up && !keys.down && Math.abs(car.v) < 0.15) car.v = 0;
  car.v = Math.max(maxR, Math.min(maxV, car.v));

  if (!wheelDrag) wheelAngle *= Math.pow(0.0008, dt); // setir balik ke tengah
  const keySteer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const steer = keySteer || wheelAngle / MAXW; // -1 kiri .. 1 kanan
  wheel.style.transform = 'rotate(' + (keySteer ? keySteer * 70 : wheelAngle) + 'deg)';
  const grip = Math.min(1, 0.3 + Math.abs(car.v) / 5);
  car.h -= steer * 1.7 * grip * Math.sign(car.v || 1) * dt;

  car.x += Math.sin(car.h) * car.v * dt;
  car.z += Math.cos(car.h) * car.v * dt;
  car.x = Math.max(-280, Math.min(280, car.x)); car.z = Math.max(-280, Math.min(280, car.z));
  for (const c of colliders) {
    const dx = car.x - c.x, dz = car.z - c.z, d = Math.hypot(dx, dz), m = c.r + 1.5;
    if (d < m && d > 0) { car.x = c.x + dx / d * m; car.z = c.z + dz / d * m; car.v *= 0.5; if (!hitCool) { thump(); hitCool = 12; } }
  }
}
function render() {
  carMesh.position.set(car.x, 0, car.z); carMesh.rotation.y = car.h;
  wheels.forEach(w => { w.rotation.x += car.v * 0.016 / 0.36; });
  sun.position.set(car.x + 45, 85, car.z + 30); sun.target.position.set(car.x, 0, car.z); sky.position.set(camera.position.x, 0, camera.position.z);
  const fx = Math.sin(car.h), fz = Math.cos(car.h);
  let tx, ty, tz, lx, ly, lz;
  if (inside) {
    tx = car.x - fx * 0.1; ty = 1.28; tz = car.z - fz * 0.1;
    lx = car.x + fx * 14; ly = 0.85; lz = car.z + fz * 14;
  } else {
    tx = car.x; ty = 70; tz = car.z - 30; lx = car.x; ly = 0; lz = car.z;
  }
  if (snapCam) { camera.position.set(tx, ty, tz); snapCam = false; }
  const k = inside ? 1 : 0.12;
  camera.position.x += (tx - camera.position.x) * k;
  camera.position.y += (ty - camera.position.y) * k;
  camera.position.z += (tz - camera.position.z) * k;
  camera.up.set(0, 1, 0);
  camera.lookAt(lx, ly, lz);
  audioUpdate(keys.up, (keys.down && car.v > 0.5) || (keys.brake && Math.abs(car.v) > 1), car.v);
  kmh.textContent = Math.round(Math.abs(car.v) * 3.6);
  renderer.render(scene, camera);
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mobil Kotak</title>
<style>html,body{height:100%}
body{margin:0;background:#232a24;color:#f2f4ef;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
 padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;min-height:0}
#stage{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#5a9e4b;aspect-ratio:8/5;width:100%;max-width:100%;max-height:100%;object-fit:contain;border:4px solid #10140f;box-sizing:border-box}
#info{font-size:13px;color:#aab4a8;text-align:center}
#pad{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;max-width:560px}
#wheel{width:120px;height:120px;border-radius:50%;border:14px solid #3a443b;box-sizing:border-box;position:relative;touch-action:none;flex:none;cursor:grab;background:#232a24}
#wheel::before{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;background:#6b7a6c;transform:translate(-50%,-50%)}
#wheel::after{content:"";position:absolute;left:0;right:0;top:50%;height:10px;margin-top:-5px;background:#3a443b}
#wheel i{position:absolute;left:50%;top:-14px;width:10px;height:22px;margin-left:-5px;background:#d93a3a;border-radius:3px;z-index:1}
#pedals{display:flex;gap:12px;align-items:flex-end}
#pedals button{border:0;border-radius:12px;color:#f2f4ef;font-weight:700;font-size:15px;touch-action:none;user-select:none}
#pedals [data-k=down]{width:64px;height:84px;background:#9b3a3a}
#pedals [data-k=up]{width:80px;height:110px;background:#3d8a4a}
#pedals button:active{filter:brightness(1.4)}
</style></head><body>
<div id="wrap">
<div id="stage"><canvas id="c" width="800" height="500"></canvas></div>
<div id="info">Panah / WASD: gas, rem, belok kiri-kanan. Spasi: rem tangan. Di layar: putar setir, tekan GAS / REM.</div>
<div id="pad">
<div id="wheel" aria-label="Setir"><i></i></div>
<div id="pedals"><button data-k="down" aria-label="Rem">REM</button><button data-k="up" aria-label="Gas">GAS</button></div>
</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---- input ----
const keys = {};
const map = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', Space:'brake' };
addEventListener('keydown', e => { const k = map[e.code]; if (k) { keys[k] = true; e.preventDefault(); } });
addEventListener('keyup', e => { const k = map[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// iframe perlu fokus agar keyboard terbaca
addEventListener('pointerdown', () => window.focus());
window.focus();
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { keys[k] = true; b.setPointerCapture(e.pointerId); e.preventDefault(); });
  const off = e => { keys[k] = false; e.preventDefault(); };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});

// ---- setir ----
const wheel = document.getElementById('wheel');
let wheelAngle = 0, wheelDrag = null;
const MAXW = 100;
const ang = (e) => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180 / Math.PI; };
wheel.addEventListener('pointerdown', e => { wheel.setPointerCapture(e.pointerId); wheelDrag = { last: ang(e) }; e.preventDefault(); });
wheel.addEventListener('pointermove', e => {
  if (!wheelDrag) return;
  const a = ang(e); let d = a - wheelDrag.last; if (d > 180) d -= 360; if (d < -180) d += 360;
  wheelDrag.last = a; wheelAngle = Math.max(-MAXW, Math.min(MAXW, wheelAngle + d));
});
const wheelUp = () => { wheelDrag = null; };
wheel.addEventListener('pointerup', wheelUp); wheel.addEventListener('pointercancel', wheelUp);

// ---- jalan aspal (lintasan oval) ----
const road = document.createElement('canvas'); road.width = W; road.height = H;
const rc = road.getContext('2d');
function trackPath(c) {
  c.beginPath();
  c.roundRect(110, 90, W - 220, H - 180, 120);
}
rc.lineJoin = 'round';
trackPath(rc); rc.lineWidth = 96; rc.strokeStyle = '#3d4044'; rc.stroke();
const roadData = rc.getImageData(0, 0, W, H).data;
const onRoad = (x, y) => {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  return roadData[(y * W + x) * 4 + 3] > 0;
};

const car = { x: W / 2, y: 90, a: 0, v: 0, w: 22, l: 40 };
const trail = [];

function update() {
  const road_ = onRoad(car.x, car.y);
  const maxV = road_ ? 5 : 2.2, maxR = -2, accel = 0.16;
  if (keys.up) car.v += accel;
  if (keys.down) car.v -= accel;
  if (keys.brake) car.v *= 0.9;
  car.v *= road_ ? 0.99 : 0.96;
  car.v = Math.max(maxR, Math.min(maxV, car.v));
  if (Math.abs(car.v) < 0.02) car.v = 0;

  if (!wheelDrag) wheelAngle *= 0.85; // setir kembali ke tengah
  const keySteer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const steer = keySteer || wheelAngle / MAXW;
  wheel.style.transform = 'rotate(' + (keySteer ? keySteer * 60 : wheelAngle) + 'deg)';
  // belok bisa dilakukan walau pelan; arah terbalik saat mundur
  const grip = Math.min(1, 0.35 + Math.abs(car.v) / 2);
  car.a += steer * 0.055 * grip * (car.v < 0 ? -1 : 1);

  const nx = car.x + Math.cos(car.a) * car.v;
  const ny = car.y + Math.sin(car.a) * car.v;
  const r = 14;
  if (nx < r || nx > W - r || ny < r || ny > H - r) car.v *= -0.4;
  else { car.x = nx; car.y = ny; }

  if (Math.abs(car.v) > 2 && (!trail.length || Math.hypot(trail.at(-1)[0] - car.x, trail.at(-1)[1] - car.y) > 6)) {
    trail.push([car.x, car.y, road_]); if (trail.length > 100) trail.shift();
  }
}

function draw() {
  ctx.fillStyle = '#5a9e4b'; ctx.fillRect(0, 0, W, H);
  // aspal + marka
  ctx.drawImage(road, 0, 0);
  ctx.save();
  trackPath(ctx); ctx.lineWidth = 3; ctx.strokeStyle = '#e8e8e0'; ctx.setLineDash([22, 18]); ctx.stroke();
  ctx.restore();
  // garis start
  ctx.fillStyle = '#fff'; ctx.fillRect(W / 2 - 3, 42, 6, 96);

  for (const [x, y, onr] of trail) { ctx.fillStyle = onr ? 'rgba(0,0,0,.25)' : 'rgba(60,40,20,.3)'; ctx.fillRect(x - 3, y - 3, 6, 6); }

  ctx.save();
  ctx.translate(car.x, car.y); ctx.rotate(car.a);
  ctx.fillStyle = '#d93a3a'; ctx.fillRect(-car.l / 2, -car.w / 2, car.l, car.w);
  ctx.fillStyle = '#9fd8ff'; ctx.fillRect(2, -car.w / 2 + 3, 10, car.w - 6);
  ctx.fillStyle = '#ffe14d'; ctx.fillRect(car.l / 2 - 4, -car.w / 2 + 2, 4, 5); ctx.fillRect(car.l / 2 - 4, car.w / 2 - 7, 4, 5);
  ctx.restore();
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script></body></html>
